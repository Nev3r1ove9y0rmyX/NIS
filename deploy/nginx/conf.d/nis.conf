# NIS 边缘入口：前端 + API Gateway 统一反代（Issue #17）
# 仅监听 80；443 段保留为验收时启用（自签证书生成见 deploy/README.md）。

upstream nis_gateway {
    server api-gateway:8000;
    keepalive 16;
}

upstream nis_frontend {
    server frontend:80;
    keepalive 16;
}

# 供 edge-proxy 健康检查使用；放在主 server 内，任意 Host 都可达，
# 不代理任何内部地址。注意：不要再新增 listen 80 的 server 块，
# 否则首个块会变成默认 server 吞掉未匹配 Host 的请求（本注释由实测教训得出）。

server {
    listen 80 default_server;
    server_name _;

    # 与 GATEWAY_MAX_BODY_BYTES 对齐
    client_max_body_size 2m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 不暴露内部服务名/版本
    server_tokens off;

    # ---- 边缘代理自身的存活探针 ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- 业务 API：唯一外部入口，路径原样转发给 Gateway ----
    location /api/v1/ {
        proxy_pass http://nis_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gateway/Coordinator 依赖请求 ID 贯穿调用链
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        # 覆盖最慢路径（AI 建议 15s）并留余量
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 网关/服务单实例：不转发到下一台，快速失败
        proxy_next_upstream off;
    }

    # ---- 前端静态站点 ----
    location / {
        proxy_pass http://nis_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

